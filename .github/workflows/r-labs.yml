name: R labs

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

jobs:
  labs:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1

      # Lab 13 (Spark) needs Java 17; lab 10 needs a running MongoDB.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: ankane/setup-mongodb@v1

      # Spark on Windows needs the VC++ 2010 SP1 runtime (winutils depends on msvcr100.dll).
      - name: Install VC++ 2010 runtime (Windows, lab 13)
        if: runner.os == 'Windows'
        run: choco install vcredist2010 -y --no-progress

      - name: Install Spark 3.5 (lab 13)
        shell: Rscript {0}
        run: sparklyr::spark_install(version = "3.5")

      # Spark on Windows also needs Hadoop winutils.exe (sparklyr prints these exact steps).
      - name: Install winutils (Windows, lab 13)
        if: runner.os == 'Windows'
        shell: Rscript {0}
        run: |
          bin <- file.path(sparklyr::spark_install_find(version = "3.5")$sparkVersionDir, "tmp", "hadoop", "bin")
          dir.create(bin, recursive = TRUE, showWarnings = FALSE)
          base <- "https://github.com/steveloughran/winutils/raw/master/hadoop-3.0.0/bin/"
          for (f in c("winutils.exe", "hadoop.dll")) download.file(paste0(base, f), file.path(bin, f), mode = "wb")
          list.files(bin)

      - name: Run all labs
        shell: bash
        run: |
          status=0
          {
            echo "### R labs on ${{ matrix.os }}"
            echo "| lab | result |"
            echo "|-----|--------|"
          } >> "$GITHUB_STEP_SUMMARY"
          for d in lab*/; do
            d=${d%/}
            echo "::group::$d"
            if Rscript run_lab.R "$d"; then r="✅ ok"
            elif [ "$d" = "lab13-r-spark" ] && { echo "retrying Spark lab once (JVM start is flaky on small runners)"; Rscript run_lab.R "$d"; }; then r="✅ ok (2nd try)"
            else r="❌ failed"; status=1; tail -n 25 "$d/output.txt" || true; fi
            echo "::endgroup::"
            echo "| $d | $r |" >> "$GITHUB_STEP_SUMMARY"
          done
          exit $status

      - name: Upload run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outputs-${{ matrix.os }}
          path: |
            lab*/output.txt
            lab*/screenshots/
          retention-days: 7
